project:
  type: book
  output-dir: _output

# ---------------------------------------------------------------------------
# Estructura del libro. El orden de esta lista es el orden final en el PDF.
# Cada capítulo corresponde a una carpeta de PROFESOR/PRACTICAS_POR_ACTUALIZAR
# (00_ a 08_) y comienza en página nueva (comportamiento por defecto de
# documentclass: scrbook para los capítulos de nivel 1, `# Título`).
# ---------------------------------------------------------------------------
book:
  title: "Prácticas de Fuentes de Datos Biomédicos y Web Semántica"
  subtitle: "Grado en Ingeniería de la Salud (#8235) · Curso 2025-2026"
  author: "Antonio Canepa Oneto, Ph.D."
  date: today
  date-format: "D [de] MMMM [de] YYYY"
  language: es
  page-navigation: true
  search: true
  repo-url: ""
  downloads: [pdf]
  cover-image: images/portada/Logo_Curso_Fuente_Datos_Biomedicas_Web_Semantica.png
  page-footer:
    left: "Escuela Politécnica Superior, Universidad de Burgos"
    right: "Licencia CC BY-NC-SA 3.0"
  chapters:
    - index.qmd
    - 00-practica-github.qmd
    - 01-seminario-rmarkdown.qmd
    - 02-objetos-r.qmd
    - 03-funciones-r.qmd
    - 04-importacion-exportacion-datos.qmd
    - 05-procesamiento-manejo-datos.qmd
    - 06-visualizacion-informacion.qmd
    - 07-consultas-rdf-sparql.qmd
    - 08-practicas-pubmed.qmd
    - references.qmd

# ---------------------------------------------------------------------------
# Bibliografía
# ---------------------------------------------------------------------------
bibliography: referencias.bib
csl: apa.csl
link-citations: true

# ---------------------------------------------------------------------------
# Idioma general del proyecto (traduce automáticamente términos internos de
# Quarto: "Índice general", "Figura", "Tabla", "Referencias", etc.)
# ---------------------------------------------------------------------------
lang: es

# ---------------------------------------------------------------------------
# Referencias cruzadas (secciones, figuras, tablas). Los capítulos usan `#`,
# las secciones `##`, subsecciones `###`, y así hasta `######` (nivel 6, el
# máximo admitido por Quarto). Cada capítulo, sección, figura y tabla que se
# referencia en el texto lleva una etiqueta explícita (#sec-, #fig-, #tbl-).
# ---------------------------------------------------------------------------
crossref:
  chapters: true
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-title: "Ecuación"
  lst-title: "Listado"
  fig-prefix: "Figura"
  tbl-prefix: "Tabla"
  sec-prefix: "Sección"
  eq-prefix: "Ecuación"
  lst-prefix: "Listado"
  title-delim: ":"
  ref-hyperlink: true

# ---------------------------------------------------------------------------
# Formato de salida: PDF vía LaTeX, con todo el aparato (índice, índice de
# tablas, índice de figuras) en español.
# ---------------------------------------------------------------------------
format:
  pdf:
    documentclass: scrbook
    classoption: [oneside, 11pt]
    lang: es
    babel-lang: spanish
    pdf-engine: lualatex

    toc: true
    toc-title: "Índice general"
    toc-depth: 3

    lof: true
    lot: true

    number-sections: true
    number-depth: 6

    fig-cap-location: bottom
    tbl-cap-location: top

    colorlinks: true
    linkcolor: NavyBlue
    citecolor: NavyBlue
    urlcolor: NavyBlue

    geometry:
      - a4paper
      - margin=2.5cm

    fontsize: 11pt
    linestretch: 1.15

    include-in-header:
      text: |
        % Fuerza los nombres en español de índices auxiliares por si
        % babel-lang no los traduce en tu distribución de LaTeX.
        \renewcommand{\contentsname}{Índice general}
        \renewcommand{\listfigurename}{Índice de figuras}
        \renewcommand{\listtablename}{Índice de tablas}
        \renewcommand{\bibname}{Referencias}
        \usepackage{longtable}
        \usepackage{booktabs}
        % Numera hasta el nivel 6 (######) también en el índice general,
        % aunque toc-depth se mantiene en 3 para no saturar el índice.
        \setcounter{secnumdepth}{6}

# ---------------------------------------------------------------------------
# Chunks de código (R): se muestran como ilustración pero no se ejecutan en
# el render del libro. Gran parte de los ejemplos dependen de datos propios
# de cada estudiante (INPUT/DATA), de servicios web en vivo (JCyL, PubMed,
# DBpedia, Wikidata) o de claves de API personales, por lo que evaluarlos
# durante el render del PDF no sería reproducible. El alumnado debe ejecutar
# el código en su propia sesión de RStudio siguiendo cada capítulo.
# ---------------------------------------------------------------------------
execute:
  echo: true
  warning: false
  eval: false
  freeze: auto

highlight-style: github
code-block-bg: true
code-line-numbers: true
